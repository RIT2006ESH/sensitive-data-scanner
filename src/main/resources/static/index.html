<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sensitive Data Scanner</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Sensitive Data Scanner Dashboard</h1>

  <div class="status-bar">
    <span id="status-badge" class="badge idle">IDLE</span>
    <span id="current-file" class="current-file"></span>
  </div>

  <div class="actions">
    <button onclick="triggerScan()">Run scan now</button>
    <button id="download-btn" onclick="downloadLatest()" disabled>Download latest report</button>
  </div>

  <div class="cards">
    <div class="card critical"><div class="label">Critical</div><div class="value" id="count-critical">0</div></div>
    <div class="card medium"><div class="label">Medium</div><div class="value" id="count-medium">0</div></div>
    <div class="card normal"><div class="label">Normal</div><div class="value" id="count-normal">0</div></div>
    <div class="card"><div class="label">Files scanned</div><div class="value" id="count-scanned">0</div></div>
    <div class="card"><div class="label">Files skipped</div><div class="value" id="count-skipped">0</div></div>
  </div>

  <h2 style="font-size:16px;">Live findings</h2>
  <table>
    <thead>
      <tr>
        <th>File name</th>
        <th>File path</th>
        <th>Type</th>
        <th>Risk level</th>
        <th>Masked value</th>
        <th>Scan timestamp</th>
        <th>File created</th>
        <th>File modified</th>
      </tr>
    </thead>
    <tbody id="findings-body"></tbody>
  </table>

  <h2 style="font-size:16px;">Scan history</h2>
  <table>
    <thead>
      <tr><th>Run ID</th><th>Status</th><th>Started</th><th>Critical</th><th>Medium</th><th>Normal</th><th>Report</th></tr>
    </thead>
    <tbody id="history-body"></tbody>
  </table>

  <script src="/dashboard.js"></script>
</body>
</html>
